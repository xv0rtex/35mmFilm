# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/filmpin?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Visitor logging (file)
app.visitorlog.file=${VISITOR_LOG_FILE:logs/filmpin-app.log}
app.visitorlog.db.enabled=${VISITOR_LOG_DB_ENABLED:true}

# Logging Configuration
logging.level.root=OFF
logging.level.org.springframework=OFF
logging.level.org.hibernate=OFF
logging.level.com.filmpin=OFF

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML

# Logging
logging.level.org.springframework.security=OFF

# File Upload Configuration
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# Uploads directory (outside classpath)
app.upload.dir=${UPLOAD_DIR:uploads/}

# Static resources caching (dev-friendly)
spring.web.resources.chain.cache=false
spring.web.resources.cache.period=0

# Session configuration (1 month)
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.secure=true

# Forwarded headers support (behind proxy)
server.forward-headers-strategy=framework

