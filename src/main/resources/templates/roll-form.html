<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Film Roll - 35mmFilm</title>
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <link rel="apple-touch-icon" th:href="@{/favicon.png}">
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZHLJ07G3SG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-ZHLJ07G3SG');
</script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a th:href="@{/dashboard}" class="navbar-brand">
                <img th:src="@{/favicon.png}" alt="Logo">
                35mmFilm
            </a>
            <div class="navbar-nav">
                <a th:href="@{'/cameras/' + ${cameraId}}">Back to Camera</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="auth-container" style="max-width: 600px;">
            <h2 class="text-center" th:text="${roll.id == null ? 'Add New Film Roll' : 'Edit Film Roll'}">Add New Film Roll</h2>
            
            <form th:action="${roll.id == null ? '/cameras/' + cameraId + '/rolls' : '/rolls/' + roll.id}" th:object="${roll}" method="post">
                <div class="form-group">
                    <label for="name">Roll Name</label>
                    <input type="text" id="name" th:field="*{name}" required>
                </div>
                <div class="form-group">
                    <label for="brand">Brand</label>
                    <input type="text" id="brand" th:field="*{brand}" required>
                </div>
                <div class="form-group">
                    <label for="iso">ISO</label>
                    <input type="number" id="iso" th:field="*{iso}" required>
                </div>
                <div class="form-group">
                    <label for="purchaseDate">Purchase Date</label>
                    <input type="date" id="purchaseDate" th:field="*{purchaseDate}" required>
                </div>
                <div class="form-group">
                    <label for="loadDate">Load Date</label>
                    <input type="date" id="loadDate" th:field="*{loadDate}">
                </div>
                <div class="form-group">
                    <label for="expiryDate">Expiry Date</label>
                    <input type="date" id="expiryDate" th:field="*{expiryDate}" required>
                </div>
                <div class="form-group">
                    <label for="filmPrice">Film Price (€)</label>
                    <input type="number" id="filmPrice" th:field="*{filmPrice}" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label for="developmentPrice">Development Price (€)</label>
                    <input type="number" id="developmentPrice" th:field="*{developmentPrice}" step="0.01" min="0">
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" th:field="*{status}" required>
                        <option value="UNEXPOSED">Unexposed</option>
                        <option value="IN_USE">In Use</option>
                        <option value="DEVELOPED">Developed</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="filmType">Film Type</label>
                    <select id="filmType" th:field="*{filmType}" required>
                        <option value="Color">Color</option>
                        <option value="B&W">Black & White</option>
                        <option value="Slide">Slide</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="pushPull">Push/Pull</label>
                    <select id="pushPull" th:field="*{pushPull}">
                        <option value="-2">-2 Stops (Pull)</option>
                        <option value="-1">-1 Stop (Pull)</option>
                        <option value="0" selected>0 (Normal)</option>
                        <option value="1">+1 Stop (Push)</option>
                        <option value="2">+2 Stops (Push)</option>
                        <option value="3">+3 Stops (Push)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" th:field="*{description}" rows="3"></textarea>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn" style="flex: 1;">Save Roll</button>
                </div>
            </form>
            
            <form th:if="${roll.id != null}" th:action="@{'/rolls/' + ${roll.id} + '/delete'}" method="post" onsubmit="return confirm('Are you sure you want to delete this roll? This action cannot be undone and all photos will be deleted.');" style="margin-top: 15px;">
                <button type="submit" class="btn btn-block" style="background-color: var(--danger-color, #e74c3c); border-color: var(--danger-color, #e74c3c);">Delete Roll</button>
            </form>
        </div>
        <footer class="app-footer">
            <p>&copy; 2026 35mmFilm. <a th:href="@{/license}">All rights reserved.</a></p>
        </footer>
    </div>
</body>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("/service-worker.js");
  });
}
</script>
</html>
