<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - 35mmFilm</title>
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <link rel="apple-touch-icon" th:href="@{/favicon.png}">
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZHLJ07G3SG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-ZHLJ07G3SG');
</script>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a th:href="@{/dashboard}" class="navbar-brand">
                <img th:src="@{/favicon.png}" alt="Logo">
                35mmFilm
            </a>
            <div class="navbar-nav">
                <a th:href="@{/dashboard}">Back</a>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-logout" style="background:none; border:none; padding:0; color:var(--text); cursor:pointer; font-size:1rem; margin-left: 15px;">Logout</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="auth-container" style="max-width: 600px;">
            <h2 class="text-center">My Profile</h2>
            
            <div th:if="${success}" class="alert alert-success" th:text="${success}" style="color: green; background: #e8f5e9; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center;"></div>
            <div th:if="${error}" class="alert alert-error" th:text="${error}" style="color: red; background: #ffebee; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center;"></div>

            <!-- Update Details Form -->
            <form th:action="@{/profile/update}" method="post" style="margin-bottom: 3rem;">
                <h3 style="border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px;">Personal Details</h3>
                
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" th:value="${user.username}" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" th:value="${user.email}" required>
                </div>
                
                <button type="submit" class="btn btn-block">Update Details</button>
            </form>
            
            <!-- Change Password Form -->
            <form th:action="@{/profile/password}" method="post">
                <h3 style="border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px;">Change Password</h3>
                
                <div th:if="${passwordSuccess}" class="alert alert-success" th:text="${passwordSuccess}" style="color: green; background: #e8f5e9; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center;"></div>
                <div th:if="${passwordError}" class="alert alert-error" th:text="${passwordError}" style="color: red; background: #ffebee; padding: 10px; border-radius: 4px; margin-bottom: 15px; text-align: center;"></div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="newPassword" required>
                </div>
                
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required>
                </div>
                
                <button type="submit" class="btn btn-secondary btn-block">Change Password</button>
            </form>
        </div>
        <footer class="app-footer">
            <p>&copy; 2026 35mmFilm. <a th:href="@{/license}">All rights reserved.</a></p>
        </footer>
    </div>
</body>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("/service-worker.js");
  });
}
</script>
</html>
