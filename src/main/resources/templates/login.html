<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - 35mmFilm</title>
    <meta name="theme-color" content="#121212">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" th:href="@{/favicon.png}">
    <link rel="apple-touch-icon" th:href="@{/favicon.png}">
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="stylesheet" th:href="@{/css/style.css}">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZHLJ07G3SG"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-ZHLJ07G3SG');
</script>
</head>
<body>
    <div class="container">
        <div class="auth-container">
            <div class="text-center" style="margin-bottom: 1.5rem;">
                <img th:src="@{/favicon.png}" alt="35mmFilm Logo" style="width: 64px; height: 64px; border-radius: 12px;">
            </div>
            <h2 class="text-center">35mmFilm Login</h2>
            
            <div th:if="${param.error}" class="alert alert-danger">
                Invalid username or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-success">
                You have been logged out.
            </div>
            <div th:if="${param.success}" class="alert alert-success">
                Registration successful! Please login.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-block">Sign In</button>
            </form>
            
            <p class="text-center mt-3">
                Don't have an account? <a th:href="@{/register}">Register here</a>
            </p>
        </div>
        <footer class="app-footer">
            <p>&copy; 2026 35mmFilm. <a th:href="@{/license}">All rights reserved.</a></p>
        </footer>
    </div>
</body>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function() {
    navigator.serviceWorker.register("/service-worker.js");
  });
}
</script>
</html>
